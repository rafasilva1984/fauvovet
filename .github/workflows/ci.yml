name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Mesmo fluxo do desenvolvedor: .env fictício + PostgreSQL embutido (sem serviços externos).
      - name: Bootstrap (PostgreSQL embutido, migrações e seed fictício)
        run: pnpm bootstrap

      - name: Gate obrigatório (pnpm verify)
        run: pnpm verify

      - name: Parar PostgreSQL local
        if: always()
        run: pnpm db:stop
