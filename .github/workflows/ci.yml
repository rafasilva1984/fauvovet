name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Mesmo fluxo do desenvolvedor: .env fictício + PostgreSQL embutido (sem serviços externos).
      - name: Bootstrap (PostgreSQL embutido, migrações e seed fictício)
        run: pnpm bootstrap

      - name: Navegador do Playwright (Chromium + dependências do sistema)
        run: pnpm --filter @fauvovet/web exec playwright install --with-deps chromium

      - name: Gate obrigatório (pnpm verify --e2e)
        run: pnpm verify --e2e

      - name: Relatório Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Parar PostgreSQL local
        if: always()
        run: pnpm db:stop
