packages:
  - apps/*
  - packages/*

# Somente pacotes revisados podem executar scripts de instalação.
# @swc/core e @node-rs/argon2 usam binários pré-compilados (scripts desnecessários).
# @embedded-postgres/*: recria symlinks das bibliotecas nativas do PostgreSQL local de desenvolvimento.
allowBuilds:
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/windows-x64': true
  '@node-rs/argon2': false
  '@swc/core': false
